# Builds and tests Windows, Linux and macOS on every push and PR.
#
# Every release ships exactly one file per OS, and that file both installs and updates:
#   SeePass-setup.exe       Windows x64 (Inno Setup; asks for the folder once, a newer setup reuses it)
#   SeePass-linux-x64       Linux x64 (installs itself into a folder you pick; a newer one updates it)
#   SeePass-macos-arm64     macOS Apple Silicon (installs itself as an .app into a folder you pick)
# plus SHA256SUMS.txt. SeePass never touches the network: running a newer download is the update.
#
# Releasing is automatic: bump `version` in Cargo.toml, add its CHANGELOG.md section and push to
# main. When no release with that version exists yet, the `release` job tags the commit (e.g.
# `v8.2.0`) and publishes the release. Pushing a matching tag by hand works too.

name: Build & Release

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            release=true
          elif [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            release=true
            for t in "v$version" "$version"; do
              if gh release view "$t" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "Release $t already exists, nothing to publish."
                release=false
              fi
            done
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "### SeePass $version (release: $release)" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Format & Clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build without legacy import
        run: cargo check --locked --no-default-features

  windows:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release
      - name: Setup (install + update in one file)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ needs.meta.outputs.version }}" "/DSourceExe=$PWD\target\release\seepass.exe" installer\seepass.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\SeePass-setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: SeePass-setup.exe
          path: SeePass-setup.exe
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: meta
    # Oldest supported Ubuntu LTS runner, so the binary runs on glibc 2.35+.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          cargo build --locked --release
          cp target/release/seepass SeePass-linux-x64
          chmod +x SeePass-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SeePass-linux-x64
          path: SeePass-linux-x64
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon
    needs: meta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/seepass SeePass-macos-arm64
          chmod +x SeePass-macos-arm64
          codesign --force -s - SeePass-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: SeePass-macos-arm64
          path: SeePass-macos-arm64
          if-no-files-found: error

  release:
    name: Publish release
    needs: [meta, lint, windows, linux, macos]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          chmod +x SeePass-linux-x64 SeePass-macos-arm64
          sha256sum SeePass-setup.exe SeePass-linux-x64 SeePass-macos-arm64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "## SeePass $VERSION"
            echo
            echo "_Made by **Akulav**: no cloud, no accounts, no telemetry. SeePass never touches the network._"
            echo
            awk -v v="$VERSION" 'index($0, "## [" v "]")==1 {f=1; next} /^## \[/ {f=0} f' ../CHANGELOG.md
            echo
            echo "One file per system. The same file installs SeePass and later updates it: just run the newer one."
            echo
            echo "| System | Download | First start |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11 (x64) | [SeePass-setup.exe]($BASE/SeePass-setup.exe) | Asks where to install (no admin rights). A newer setup reuses that folder. |"
            echo "| Linux x64 (glibc 2.35+) | [SeePass-linux-x64]($BASE/SeePass-linux-x64) | \`chmod +x\` it and run it. It asks where to install. |"
            echo "| macOS Apple Silicon | [SeePass-macos-arm64]($BASE/SeePass-macos-arm64) | \`chmod +x\`, then right-click → Open. It asks where to install. |"
            echo
            echo "The app and your encrypted vault live in the folder you choose."
            echo
            echo "<details><summary>SHA-256 checksums</summary>"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo "</details>"
            echo
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          name: SeePass v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: dist/notes.md
          make_latest: true
          files: |
            dist/SeePass-setup.exe
            dist/SeePass-linux-x64
            dist/SeePass-macos-arm64
            dist/SHA256SUMS.txt
