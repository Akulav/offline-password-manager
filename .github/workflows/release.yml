name: Release

# Publishes the executables on the repository's Releases page.
#
# - Every push to main checks the version in Cargo.toml. If there is no release
#   for it yet, it builds Windows, Linux and macOS binaries, creates the tag
#   v<version> and publishes the release. Bumping the version is all it takes.
# - Pushing a tag (v8.1.0 or 8.1.0) does the same for that tag.
# - Actions -> Release -> Run workflow rebuilds a version (replacing its files).
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*", "[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, e.g. v8.1.0. Leave empty for the Cargo.toml version."
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Decide what to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual rebuild of an existing tag builds that tag's code.
          ref: ${{ github.event.inputs.tag || github.sha }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "Cargo.toml version: $version"

          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$version"
          fi
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::Tag $tag does not match Cargo.toml version $version. Bump Cargo.toml first."
            exit 1
          fi

          release=true
          if [ "$EVENT" != "workflow_dispatch" ]; then
            # A release may already exist under either spelling of the tag.
            for t in "v$version" "$version"; do
              if gh release view "$t" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                echo "Release $t already exists; nothing to do. Bump the version in Cargo.toml to publish a new one."
                release=false
              fi
            done
          fi

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no '## [$version]' section; the release notes will only list the downloads."
          fi

          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "release=$release"
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: seepass.exe
          # Oldest supported Ubuntu LTS runner, so the binary runs on glibc 2.35+.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            exe: seepass
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: seepass
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="seepass-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$name/"
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp assets/seepass.desktop "dist/$name/"
            cp assets/seepass-256.png "dist/$name/seepass.png"
          fi
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            # A bare .exe as well, for people who just want to double-click it.
            cp "$name/${{ matrix.exe }}" "$name.exe"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }} \
            --output "dist/seepass-${VERSION}-linux-x64.deb"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Windows 10/11 (x64) | \`seepass-$VERSION-windows-x64.exe\` (or the \`.zip\`) |"
            echo "| Debian / Ubuntu (x64) | \`seepass-$VERSION-linux-x64.deb\` |"
            echo "| Other Linux (x64, glibc 2.35+) | \`seepass-$VERSION-linux-x64.tar.gz\` |"
            echo "| macOS (Apple silicon) | \`seepass-$VERSION-macos-arm64.tar.gz\` |"
            echo
            echo "### Verifying your download"
            echo
            echo "Compare the SHA-256 of the file you downloaded with \`SHA256SUMS.txt\`:"
            echo
            echo '```'
            echo "Get-FileHash .\\seepass-$VERSION-windows-x64.exe   # Windows PowerShell"
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing          # Linux / macOS'
            echo '```'
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          # Creates the tag on this commit when it does not exist yet.
          target_commitish: ${{ needs.plan.outputs.sha }}
          name: SeePass ${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.plan.outputs.prerelease != 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
